# Nginx para SPA estatica (React + Vite).
server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # --- Assets con hash de Vite (name.[hash].js/css) ---------------------
    # Inmutables: el hash cambia cuando cambia el contenido -> cache agresivo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- Fallback SPA -----------------------------------------------------
    # React Router maneja las rutas en el cliente. Para cualquier ruta que no
    # sea un archivo real, se devuelve index.html (evita 404 al refrescar).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- index.html nunca se cachea (apunta a los assets hasheados) --------
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # --- Seguridad basica de headers --------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
}
